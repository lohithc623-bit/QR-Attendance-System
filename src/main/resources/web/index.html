<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>QR Attendance</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar" hidden>
    <strong id="who"></strong>
    <span class="spacer"></span>
    <button id="themeBtn" class="ghost" title="Toggle dark mode" aria-label="Toggle dark mode">🌓</button>
    <button id="logoutBtn" class="ghost">Logout</button>
  </header>
  <main id="app"></main>
  <div id="flash" aria-live="assertive"></div>
  <!-- QR scanning library (needs internet once; for fully offline use, download it into src/main/resources/web/ and change this src to /html5-qrcode.min.js) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
