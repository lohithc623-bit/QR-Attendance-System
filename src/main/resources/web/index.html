<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="QR Attendance System - Secure rotating HMAC-SHA256 QR codes, webcam scanning, Google SSO, and comprehensive academic reporting">
  <title>QR Attendance · Smart Campus Attendance System</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar" hidden>
    <div class="brand-group">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
          <line x1="7" y1="7" x2="7.01" y2="7"></line>
          <line x1="17" y1="7" x2="17.01" y2="7"></line>
          <line x1="7" y1="17" x2="7.01" y2="17"></line>
          <line x1="17" y1="17" x2="17.01" y2="17"></line>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">QR Attendance</span>
        <span class="brand-badge">v2.1</span>
      </div>
    </div>
    
    <span class="spacer"></span>
    
    <div class="nav-actions">
      <button id="navLimitsBtn" class="pill-btn nav-btn" title="View System Limitations & Security Analysis">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>Limitations</span>
      </button>

      <div class="user-chip">
        <div id="userAvatar" class="user-avatar">?</div>
        <div class="user-details">
          <strong id="who">User</strong>
          <span id="roleBadge" class="user-role-tag">ROLE</span>
        </div>
      </div>

      <button id="themeBtn" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <span id="themeIcon">🌓</span>
      </button>
      
      <button id="logoutBtn" class="danger-ghost-btn" title="Sign out of system">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <div id="modalOverlay" class="modal-backdrop" hidden>
    <div id="modalContainer" class="modal-shell" role="dialog" aria-modal="true"></div>
  </div>

  <div id="flash" aria-live="assertive"></div>

  <!-- Google Identity Services (SSO) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- QR scanning library (needs internet once or unpkg cache) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
